name: Publish

# Trusted publishing: npm trusts this repository and this filename, and the token
# is minted per run from the OIDC identity. No secret is stored anywhere.
#
# A tag push needs no browser and no personal token: the same job creates the
# release for that tag and publishes the package. A release made by the workflow's
# own token would not start another workflow, which is why both steps live here
# rather than one of them behind `release: published`.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # The tag names the release; an existing one is left alone, so re-running
      # this workflow never rewrites a body someone wrote by hand.
      - name: Release this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
      - run: npm publish --access public
