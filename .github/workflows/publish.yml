name: Publish

# Trusted publishing: the npm side trusts this repository and this filename, and
# the token is minted per run from the OIDC identity. No secret is stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: npm publish --access public
